# OPTIONAL safety net: an external pinger that can also WAKE the API if it is ever asleep
# (the in-app cron can only keep an already-running server awake).
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> Variables -> New variable
#        Name: API_URL   Value: https://your-api.onrender.com
name: Keep Render API awake
on:
  schedule:
    - cron: '*/10 * * * *'   # GitHub may delay scheduled runs by a few minutes
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        env:
          API_URL: https://legacytree-api.onrender.com
        run: |
          if [ -z "$API_URL" ]; then echo "Set the repository variable API_URL first"; exit 1; fi
          echo "$(date -u +%FT%TZ) GET ${API_URL%/}/health"
          curl --fail --silent --show-error --max-time 60 --retry 3 --retry-delay 10 --retry-all-errors "${API_URL%/}/health"
          echo
